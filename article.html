<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章</title>
<link rel="stylesheet" href="/text/style.css">
<!-- markdown 渲染库。也可下载到本地，避免依赖外网 -->
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="/text/index.html">← 返回目录</a>

  <div class="article-header">
    <h1 id="title">加载中…</h1>
  </div>

  <div class="article-body" id="body">
    <p class="article-status">加载中…</p>
  </div>

</div>

<script src="posts.js"></script>
<script>
(function () {
  'use strict';

  const titleEl = document.getElementById('title');
  const bodyEl  = document.getElementById('body');

  // 从 URL 取 ?p=xxx
  const slug = new URLSearchParams(location.search).get('p') || '';
  const post = (window.POSTS || []).find(function (p) { return p.slug === slug; });

  /* ---------- 文章不存在 ---------- */
  if (!post) {
    document.title = '文章不存在';
    titleEl.textContent = '文章不存在';
    bodyEl.innerHTML =
      '<p class="article-status">没有找到这篇文章。' +
      '<a href="/text/index.html">返回目录</a></p>';
    return;
  }

  /* ---------- 先渲染标题和日期（不依赖 md 加载成功） ---------- */
  document.title = post.title + ' — 文章存档';
  titleEl.textContent = post.title;


  /* ---------- 加载并渲染 markdown ---------- */
 fetch('posts/' + encodeURIComponent(slug) + '.md', {
      headers: { 'Accept': 'text/plain' },
      cache: 'no-store'
    })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (md) {
      if (typeof marked === 'undefined') {
        throw new Error('marked 未加载');
      }
      bodyEl.innerHTML = marked.parse(md);
    })
    .catch(function (err) {
      // 常见原因：file:// 直接打开、md 文件不存在、断网导致 marked 没加载
      bodyEl.innerHTML =
        '<p class="article-status">文章加载失败（' + esc(err.message) + '）。</p>' +
        '<p class="article-status">如果是直接双击 HTML 打开的，请改用本地服务器：' +
        '在站点根目录运行 <code>python3 -m http.server 8000</code>，' +
        '然后访问 <code>http://localhost:8000</code>。</p>';
    });

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
