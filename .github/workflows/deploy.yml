name: Encrypt and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt files
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          # 创建输出目录
          mkdir -p dist
          
          # 运行加密（注意：如果你的 password_template.html 没有放在 src 里，请把这行 --template 参数删掉）
          staticrypt ./src -r \
            --salt "a1b2c3d4e5f678901234567890abcdef" \
            --remember 168 \
            --share-remember \
            --template ./src/password_template.html \
            --template-title "请输入密码" \
            --template-instructions "提示：WS接下来要参加试镜的剧目是？" \
            --directory ./dist
            
          # 检查是否成功生成了文件
          echo "=== 检查 dist 文件夹内容 ==="
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
