name: Encrypt and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 peaceiris/actions-gh-pages 推送 gh-pages 分支
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt files
        run: |
          mkdir -p dist
          staticrypt ./src -r \
            --salt "a1b2c3d4e5f678901234567890abcdef" \
            --remember 720 \
            --share-remember \
            --template ./src/password_template.html \
            --directory ./dist
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true # 强制重建分支，避免冲突
