name: Encrypt and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt files
        run: |
          staticrypt ./src -r \
            --salt "a1b2c3d4e5f678901234567890abcdef" \
            --remember 720 \
            --share-remember \
            --template ./src/password_template.html
            --directory -d ./dist
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'GQMX10'
          user_email: 'daysandmoons2015@163.com'
